name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # corepack ships with Node and activates the exact pnpm pinned in
      # package.json's packageManager field, so CI cannot drift to a different
      # version and no third-party action has to be trusted for it.
      #
      # Enabled twice on purpose. The first call puts pnpm on PATH so
      # setup-node's `cache: pnpm` can resolve the store location. setup-node
      # then switches PATH to its own Node installation, leaving those shims
      # behind whichever Node was active before it, so the second call
      # re-creates them against the Node the rest of the job actually uses.
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: corepack enable
      - name: Show the pnpm actually in use
        run: pnpm --version
      # A stray package-lock.json or yarn.lock would install a different tree
      # than pnpm-lock.yaml describes, and nothing else would notice.
      - name: Fail if a non-pnpm lockfile was committed
        run: |
          found=$(ls package-lock.json npm-shrinkwrap.json yarn.lock bun.lockb 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "This project is pnpm-only; remove: $found" >&2
            exit 1
          fi
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile server.py run.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
        if: matrix.python == '3.13'
      - run: pnpm test:e2e
        if: matrix.python == '3.13'
      # Traces and error contexts are the only record of a browser failure that
      # does not reproduce on a developer machine, so keep them when a run fails.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && matrix.python == '3.13'
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: node --check web/app.js
      - run: node --check web/library.js
      - run: node --check web/theme.js
      - run: node --check web/conversation.js
      - run: node --check web/conversation-ui.js
      - run: node --check web/workflow.js
      - run: node --check web/workflow-ui.js

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Built-in pattern check (no dependencies)
        run: node scripts/check-secrets.mjs --all
      - name: gitleaks over full history
        # The gitleaks GitHub Action needs a paid license for organization repos;
        # the binary is MIT. Pin the version and verify the release checksum.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
